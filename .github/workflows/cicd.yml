name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cicd.yml'
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Viet lenh de chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage (AWS)
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV

      - name: Pull data with DVC
        # TODO 3: Pull cac file du lieu can thiet tu cloud storage bang lenh dvc pull.
        #         Chi pull train_batch1.csv va holdout.csv (khong can train_batch2.csv).
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # TODO 4: Doc gia tri "f1_score" tu outputs/report.json bang Python inline.
        #         Set ket qua thanh output "f1" de job quality-gate co the doc.
        run: |
          F1=$(python -c "import json; d=json.load(open('outputs/report.json')); print(d['f1_score'])")
          echo "f1=$F1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage (AWS S3)
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os
          import boto3

          bucket_name = os.environ["ARTIFACT_BUCKET"]
          s3 = boto3.client("s3")
          s3.upload_file("models/model.joblib", bucket_name, "artifacts/current/model.joblib")
          print(f"Uploaded model to s3://{bucket_name}/artifacts/current/model.joblib")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        # TODO 6: Doc f1 tu output cua job train.
        #         Neu f1 < 0.65, ket thuc voi loi ro rang.
        #         Neu dat nguong, in thong bao va tiep tuc.
        run: |
          python - <<'PYEOF'
          f1 = float("${{ needs.train.outputs.f1 }}")
          if f1 < 0.65:
              raise SystemExit(f"FAILED: f1_score {f1:.4f} < 0.65. Huy trien khai.")
          print("PASSED: dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len VM qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files via ssh
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src/serve.py"
          target: "/home/${{ secrets.SERVER_USER }}/"

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,ARTIFACT_BUCKET
          script: |
            set -eu

            DEPLOY_USER=$(id -un)
            test -f "$HOME/src/serve.py"

            # Keep the inference environment independent from the VM's system Python.
            if ! test -x "$HOME/income-api-venv/bin/python"; then
              if ! python3 -m venv "$HOME/income-api-venv"; then
                sudo apt-get update
                sudo apt-get install -y python3-venv
                python3 -m venv "$HOME/income-api-venv"
              fi
            fi
            "$HOME/income-api-venv/bin/python" -m pip install --quiet --upgrade pip
            "$HOME/income-api-venv/bin/python" -m pip install --quiet \
              fastapi==0.111.0 uvicorn==0.29.0 scikit-learn==1.4.2 \
              joblib==1.4.2 boto3==1.34.89

            # boto3 reads credentials and region from these two files when the
            # systemd service starts outside this SSH session.
            mkdir -p ~/.aws
            cat <<EOF > ~/.aws/credentials
            [default]
            aws_access_key_id = $AWS_ACCESS_KEY_ID
            aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
            EOF
            cat <<EOF > ~/.aws/config
            [default]
            region = $AWS_REGION
            EOF
            chmod 600 ~/.aws/credentials ~/.aws/config

            # Recreate the unit so its user, paths and bucket always match the
            # deployment secrets instead of depending on manual VM setup.
            sudo tee /etc/systemd/system/income-api.service > /dev/null <<EOF
            [Unit]
            Description=Income Model Inference Server
            Wants=network-online.target
            After=network-online.target

            [Service]
            User=$DEPLOY_USER
            WorkingDirectory=$HOME
            Environment="HOME=$HOME"
            Environment="ARTIFACT_BUCKET=$ARTIFACT_BUCKET"
            Environment="AWS_DEFAULT_REGION=$AWS_REGION"
            ExecStart=$HOME/income-api-venv/bin/python $HOME/src/serve.py
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF

            sudo systemctl daemon-reload
            sudo systemctl enable income-api
            sudo systemctl restart income-api

            # Model download and Python startup can take longer than five seconds.
            for attempt in $(seq 1 12); do
              if curl --silent --fail http://localhost:8080/healthz; then
                echo
                echo "Health check passed on attempt $attempt."
                exit 0
              fi
              echo "Waiting for API ($attempt/12)..."
              sleep 5
            done

            echo "API did not become healthy. Service diagnostics:"
            sudo systemctl status income-api --no-pager || true
            sudo journalctl -u income-api --no-pager -n 100 || true
            exit 1
